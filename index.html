function localScenes(idea){const e=['🎯','💡','✅','🚀'];const h=['Rukiye! '+idea,'Sabse pehla step','Yeh try karein','Aaj se shuru karein'];const t=['Yeh jaanna zaroori hai','Chhote step, roz practice','Consistency hi asli key hai','Follow karein aur practice karein'];return h.map((x,i)=>({h:x,t:t[i],e:e[i],a:PAL[i][0],b:PAL[i][1]}))}

 $('#rs').onclick=()=>{if(confirm('Delete all progress?')){try{localStorage.removeItem('spai')}catch(e){}S={lang:'Hinglish',other:'',level:'Beginner',goal:'',done:[],fav:[],hist:[],name:'',plan:null,theme:'auto'};render()}}}
function theme(){if(S.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme)}
document.addEventListener('focusin',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&!['file','range','checkbox'].includes(t.type))))document.body.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!a||!(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['file','range','checkbox'].includes(a.type))))document.body.classList.remove('kb')},150));
theme();render();
setTimeout(()=>{const s=$('#splash');s.style.opacity=0;setTimeout(()=>s.remove(),600)},2200);
</script></body></html>
